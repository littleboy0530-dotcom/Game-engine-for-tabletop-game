# 장기판: 가로 9줄 × 세로 10줄의 교차점. 말은 선을 따라 움직인다.
id: board
coords: square
size: [9, 10]
style: points
adjacency: orthogonal
zoneDefaults:
  accepts: [piece]

# 궁성 안의 대각선도 선이다 → 보드 그래프의 간선으로 넣는다
edges:
  - [[3, 0], [4, 1]]
  - [[5, 0], [4, 1]]
  - [[3, 2], [4, 1]]
  - [[5, 2], [4, 1]]
  - [[3, 7], [4, 8]]
  - [[5, 7], [4, 8]]
  - [[3, 9], [4, 8]]
  - [[5, 9], [4, 8]]

tags:
  궁성: [[3,0],[4,0],[5,0],[3,1],[4,1],[5,1],[3,2],[4,2],[5,2],
        [3,7],[4,7],[5,7],[3,8],[4,8],[5,8],[3,9],[4,9],[5,9]]
  초궁성: [[3,0],[4,0],[5,0],[3,1],[4,1],[5,1],[3,2],[4,2],[5,2]]
  한궁성: [[3,7],[4,7],[5,7],[3,8],[4,8],[5,8],[3,9],[4,9],[5,9]]

zones:
  - { id: captured_cho, name: 초가 잡은 말, layout: row }
  - { id: captured_han, name: 한이 잡은 말, layout: row }

# 카드 피라미드: 앞줄(y=0) 5장부터 맨 위(y=4) 1장까지 15장.
# (x, y) 카드는 바로 앞줄의 (x-1, y-1), (x+1, y-1) 카드가 모두 빠져야 가져갈 수 있다.
id: pyramid
coords: square
size: [9, 5]
style: cards
adjacency: none
tags:
  칸: [[0,0],[2,0],[4,0],[6,0],[8,0],
       [1,1],[3,1],[5,1],[7,1],
       [2,2],[4,2],[6,2],
       [3,3],[5,3],
       [4,4]]
  뒷면: [[1,1],[3,1],[5,1],[7,1],[3,3],[5,3]]
zones:
  - { id: deck, name: 남은 카드, layout: pile, visibility: hidden }
  - { id: sold, name: 판 카드, layout: pile, visibility: topOnly }
  - { id: tableau, name: 가져간 카드, perPlayer: true, layout: row }

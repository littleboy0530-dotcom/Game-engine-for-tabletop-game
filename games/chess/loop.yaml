# 체스의 진행: 턴 시작 → (말 이동 | 기권) → 승패 판정 → 다음 턴
nodes:
  start:  { type: start, pos: [0, 120] }
  turn:   { type: phase, label: 턴 시작, pos: [160, 120] }
  move:   { type: action, label: 말 이동, script: loop/move.lua, pos: [360, 40] }
  resign: { type: action, label: 기권, script: loop/resign.lua, pos: [360, 200] }
  judge:  { type: phase, label: 승패 판정, script: loop/judge.lua, pos: [560, 120] }
  end:    { type: end, pos: [760, 120] }
edges:
  - [start, turn]
  - [turn, move]
  - [turn, resign]
  - [move, judge]
  - [resign, judge]
  - [judge, turn]
  - [judge, end]
